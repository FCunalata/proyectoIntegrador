server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/app_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: admin
    password: adminpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: "cGxhdGFmb3JtYS1sb2dnaW4tc2VjcmV0LWtleS1jYW1iaWFyLWVuLXByb2R1Y2Npb24="
    expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health, info
