<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión · Loggin Platform</title>
  <meta name="description" content="Inicia sesión en tu cuenta" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#contenido-principal">Saltar al contenido principal</a>

  <div class="app-shell">
    <header class="navbar">
      <nav class="navbar__inner" aria-label="Navegación principal">
        <a class="navbar__brand" href="index.html">
          <span class="navbar__brand-icon" aria-hidden="true">L</span>
          Loggin Platform
        </a>
        <ul class="navbar__links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="login.html" aria-current="page">Iniciar sesión</a></li>
          <li><a href="registro.html">Registrarse</a></li>
        </ul>
      </nav>
    </header>

    <main id="contenido-principal" class="main-content">
      <div class="container">
        <section class="card" aria-labelledby="login-title">
          <div class="card__header">
            <h1 id="login-title" class="card__title">Iniciar sesión</h1>
            <p class="card__subtitle">Ingresa tus credenciales para continuar</p>
          </div>

          <form id="login-form" novalidate>
            <div class="form-field">
              <label class="form-label" for="nombreUsuario">
                Nombre de usuario <span class="required" aria-hidden="true">*</span>
              </label>
              <input
                class="form-input"
                type="text"
                id="nombreUsuario"
                name="nombreUsuario"
                autocomplete="username"
                required
                aria-describedby="nombreUsuario-error"
              />
              <p class="form-error" id="nombreUsuario-error" role="alert"></p>
            </div>

            <div class="form-field">
              <label class="form-label" for="password">
                Contraseña <span class="required" aria-hidden="true">*</span>
              </label>
              <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
                aria-describedby="password-error"
              />
              <p class="form-error" id="password-error" role="alert"></p>
            </div>

            <button class="btn btn-primary" type="submit" id="login-submit">
              <span class="btn-label">Iniciar sesión</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </form>

          <p class="form-footer">
            ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
          </p>
        </section>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("login-submit");

    const { validarTodo } = attachRealtimeValidation(form, {
      nombreUsuario: [VALIDADORES.required],
      password: [VALIDADORES.required],
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!validarTodo()) {
        showToast("Revisa los campos marcados en rojo.", "error");
        return;
      }

      setButtonLoading(submitBtn, true);
      try {
        const data = await apiRequest("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            nombreUsuario: document.getElementById("nombreUsuario").value.trim(),
            password: document.getElementById("password").value,
          }),
        });

        sessionStorage.setItem("token", data.token);
        sessionStorage.setItem("nombreUsuario", data.nombreUsuario);
        showToast("Inicio de sesión exitoso.", "success");
        window.setTimeout(() => {
          window.location.href = "perfil.html";
        }, 800);
      } catch (err) {
        aplicarErroresBackend(err.errores);
        showToast(err.message, "error");
      } finally {
        setButtonLoading(submitBtn, false);
      }
    });
  </script>
</body>
</html>
