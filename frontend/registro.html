<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear cuenta · LOGGIN GRUPO 4</title>
  <meta name="description" content="Crea una nueva cuenta" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#contenido-principal">Saltar al contenido principal</a>

  <div class="app-shell">
    <header class="navbar">
      <nav class="navbar__inner" aria-label="Navegación principal">
        <a class="navbar__brand" href="index.html">
          <span class="navbar__brand-icon" aria-hidden="true">L</span>
          LOGGIN GRUPO 4
        </a>
        <ul class="navbar__links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="login.html">Iniciar sesión</a></li>
          <li><a href="registro.html" aria-current="page">Registrarse</a></li>
        </ul>
      </nav>
    </header>

    <main id="contenido-principal" class="main-content">
      <div class="container">
        <section class="card" aria-labelledby="registro-title">
          <div class="card__header">
            <h1 id="registro-title" class="card__title">Crear cuenta</h1>
            <p class="card__subtitle">Completa el formulario para registrarte</p>
          </div>

          <form id="registro-form" novalidate>
            <div class="form-field">
              <label class="form-label" for="nombreUsuario">
                Nombre de usuario <span class="required" aria-hidden="true">*</span>
              </label>
              <input
                class="form-input"
                type="text"
                id="nombreUsuario"
                name="nombreUsuario"
                autocomplete="username"
                required
                aria-describedby="nombreUsuario-error nombreUsuario-hint"
              />
              <p class="form-hint" id="nombreUsuario-hint">Entre 4 y 50 caracteres.</p>
              <p class="form-error" id="nombreUsuario-error" role="alert"></p>
            </div>

            <div class="form-field">
              <label class="form-label" for="email">
                Correo electrónico <span class="required" aria-hidden="true">*</span>
              </label>
              <input
                class="form-input"
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
                aria-describedby="email-error"
              />
              <p class="form-error" id="email-error" role="alert"></p>
            </div>

            <div class="form-field">
              <label class="form-label" for="password">
                Contraseña <span class="required" aria-hidden="true">*</span>
              </label>
              <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                required
                aria-describedby="password-error password-hint"
              />
              <p class="form-hint" id="password-hint">
                Mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial.
              </p>
              <p class="form-error" id="password-error" role="alert"></p>
            </div>

            <div class="form-field">
              <label class="form-label" for="confirmarPassword">
                Confirmar contraseña <span class="required" aria-hidden="true">*</span>
              </label>
              <input
                class="form-input"
                type="password"
                id="confirmarPassword"
                name="confirmarPassword"
                autocomplete="new-password"
                required
                aria-describedby="confirmarPassword-error"
              />
              <p class="form-error" id="confirmarPassword-error" role="alert"></p>
            </div>

            <button class="btn btn-primary" type="submit" id="registro-submit">
              <span class="btn-label">Crear cuenta</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </form>

          <p class="form-footer">
            ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
          </p>
        </section>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    const form = document.getElementById("registro-form");
    const submitBtn = document.getElementById("registro-submit");

    const { validarTodo } = attachRealtimeValidation(form, {
      nombreUsuario: [VALIDADORES.required, VALIDADORES.minLength(4)],
      email: [VALIDADORES.required, VALIDADORES.email],
      password: [VALIDADORES.required, VALIDADORES.passwordSegura],
      confirmarPassword: [
        VALIDADORES.required,
        VALIDADORES.match("password", "la contraseña"),
      ],
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!validarTodo()) {
        showToast("Revisa los campos marcados en rojo.", "error");
        return;
      }

      setButtonLoading(submitBtn, true);
      try {
        await apiRequest("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            nombreUsuario: document.getElementById("nombreUsuario").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });

        showToast("Cuenta creada correctamente. Ya puedes iniciar sesión.", "success");
        form.reset();
        window.setTimeout(() => {
          window.location.href = "login.html";
        }, 1200);
      } catch (err) {
        aplicarErroresBackend(err.errores);
        showToast(err.message, "error");
      } finally {
        setButtonLoading(submitBtn, false);
      }
    });
  </script>
</body>
</html>
